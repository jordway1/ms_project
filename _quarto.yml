project:
  type: book

book:
  title: "Physical Education Knowledge and Self-Reported Behavioral Outcomes"
  author: "James Ordway"
  chapters:
    - index.qmd
    - introduction.qmd
    - methods.qmd
    - results.qmd
    - discussion.qmd
    - references.qmd
    - appendix.qmd

bibliogrpahy: references.bib
nocite: |
  @*

format:
  pdf:
    documentclass: report
    papersize: letter
    toc: true
    number-sections: true
    colorlinks: true
    classoption: [oneside]
    output-file: "PE_Knowledge_Project.pdf"
    geometry: "top=1in, bottom=1in, left=1in, right=1in, footskip=0.5in"
    include-in-header:
      text: |
        \usepackage{float}
        \usepackage{titlesec}
        \titleformat{\chapter}[block]{\normalfont\huge\bfseries}{}{0pt}{}
        \titlespacing*{\chapter}{0pt}{-20pt}{20pt}